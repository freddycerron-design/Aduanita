# Tema de AduANITA -- paleta tomada de EstimaDORA (app hermana): fondo azul
# marino casi negro, tarjetas en un azul marino apenas mas claro, acento
# coral/naranja como color primario. Ver frontend/dashboard.py ->
# _inyectar_estilos() para los componentes custom que complementan este
# theme base (config.toml solo cubre colores; la tipografia real y las
# tarjetas de discrepancia/clasificacion/correo se definen ahi).
[theme]
base = "dark"
primaryColor = "#E2583E"
backgroundColor = "#10141C"
secondaryBackgroundColor = "#171B2C"
textColor = "#F4F5F7"
font = "sans serif"

[server]
headless = true
