# Blueprint de Render para desplegar el backend FastAPI y el dashboard
# Streamlit como dos "Web Services" independientes.
#
# Uso: en Render Dashboard -> "New" -> "Blueprint" -> conectar este repo.
# Render detecta este archivo y crea ambos servicios automaticamente.
#
# Los env vars con "sync: false" NO se guardan en este archivo (ni en git):
# Render pedira que los completes manualmente en su dashboard la primera vez.

services:
  - type: web
    name: aduanita-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documentos-aduaneros
      - key: GEMINI_API_KEY
        sync: false
      # URL publica del servicio de frontend (ver mas abajo); se usa para
      # el whitelist de CORS. Ajustar si cambias el "name" del frontend.
      - key: CORS_ORIGIN
        value: https://aduanita-frontend.onrender.com

  - type: web
    name: aduanita-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/dashboard.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documentos-aduaneros
      # URL publica del servicio de backend (ver arriba); se usa para que
      # el dashboard sepa a donde llamar. Ajustar si cambias el "name"
      # del backend.
      - key: API_BASE_URL
        value: https://aduanita-backend.onrender.com
